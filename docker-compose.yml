services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_tracker
    ports:
      - "5432:5432"
    volumes:
      - credit-tracker-data:/var/lib/postgresql/data

volumes:
  credit-tracker-data:
