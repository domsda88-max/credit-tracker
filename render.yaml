# Render Blueprint — ОДИН сервис: Express раздаёт и API (/api/*), и собранный клиент (PWA).
# Однодоменный вариант: нет CORS, нет отдельного статик-сайта, нет VITE_API_URL.
# Секреты (sync: false) задаются в панели Render и в репозиторий не попадают.
services:
  - type: web
    name: credit-tracker-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # --include=dev обязателен: NODE_ENV=production иначе отрежет typescript/prisma/vite
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build && cd ../client && npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Supabase: session pooler (порт 5432) — приложение и миграции.
      # Прямой хост db.<ref>.supabase.co — IPv6-only, поэтому DIRECT_URL тоже на пулере.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Совпадает с адресом сервиса (same-origin)
      - key: CLIENT_ORIGIN
        sync: false
