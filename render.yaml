# Render Blueprint — описывает оба сервиса сразу.
# Секреты (sync: false) задаются в панели Render и в репозиторий не попадают.
services:
  # ——————————————————— API: Express + Prisma + node-cron ———————————————————
  - type: web
    name: credit-tracker-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Supabase: Session pooler (порт 5432) — запросы приложения
      - key: DATABASE_URL
        sync: false
      # Supabase: прямое подключение (порт 5432) — prisma migrate deploy
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # адрес статики клиента — задать после первого деплоя клиента
      - key: CLIENT_ORIGIN
        sync: false

  # ——————————————————— Клиент: React + PWA (статика) ———————————————————
  - type: web
    name: credit-tracker-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: прямые ссылки вида /credits/<id> должны отдавать index.html
      - type: rewrite
        source: /*
        destination: /index.html
