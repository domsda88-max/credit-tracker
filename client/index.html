<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Credit Tracker" />
    <meta name="theme-color" content="#38245F" />
    <meta name="description" content="Учёт кредитов, график платежей и push-напоминания" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Credit Tracker</title>
    <script src="/theme-init.js"></script>
    <style>
      html, body { background: var(--color-bg, #f5f4f0); }
      html[data-theme='dark'], html[data-theme='dark'] body { background: var(--color-bg, #11151c); }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: inherit; transition: opacity 240ms ease; }
      #splash.is-hidden { opacity: 0; pointer-events: none; }
      #splash img { width: 88px; height: 88px; border-radius: 23px; box-shadow: 0 12px 34px rgb(45 26 75 / .28); }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/icon.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
