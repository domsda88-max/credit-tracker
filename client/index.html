<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Credit Tracker" />
    <meta name="theme-color" content="#30204F" />
    <meta name="description" content="Учёт кредитов, график платежей и push-напоминания" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Credit Tracker</title>
    <script src="/theme-init.js"></script>
    <style>
      html, body { background: var(--color-bg, #f5f4f0); }
      html[data-theme='dark'], html[data-theme='dark'] body { background: var(--color-bg, #11151c); }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: inherit; transition: opacity 240ms ease; }
      #splash.is-hidden { opacity: 0; pointer-events: none; }
      #splash svg { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 30px rgb(25 37 54 / .14); }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49306f"/><stop offset="1" stop-color="#1b1530"/></linearGradient><linearGradient id="sg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9caff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#c5a8ff"/></linearGradient></defs>
        <rect width="72" height="72" rx="20" fill="url(#sbg)"/>
        <path d="M15 54 L27 42 L36 47 L54 24" fill="none" stroke="url(#sg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M44 24 L55 23 L54 34" fill="none" stroke="url(#sg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
