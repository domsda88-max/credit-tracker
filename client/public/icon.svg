<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68439A"/><stop offset=".52" stop-color="#38245F"/><stop offset="1" stop-color="#211735"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#A77BFF" stop-opacity=".52"/><stop offset=".38" stop-color="#F4EDFF" stop-opacity=".88"/><stop offset=".68" stop-color="#FFFFFF" stop-opacity=".96"/><stop offset="1" stop-color="#BFA2FF" stop-opacity=".72"/></linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8C4FF" stop-opacity=".56"/><stop offset="1" stop-color="#8E64D9" stop-opacity=".28"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".96"/><stop offset=".45" stop-color="#DCCBFF" stop-opacity=".86"/><stop offset="1" stop-color="#9D79E5" stop-opacity=".68"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity=".17" stroke-width="4"/>
  <ellipse cx="170" cy="104" rx="190" ry="112" fill="#C9A9FF" opacity=".12"/>
  <ellipse cx="336" cy="398" rx="140" ry="72" fill="#A77BFF" opacity=".12" filter="url(#glow)"/>
  <!-- bank cards, layered like a small stack -->
  <g filter="url(#shadow)" transform="rotate(-11 226 237)">
    <rect x="104" y="106" width="230" height="292" rx="28" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="4"/>
    <rect x="119" y="120" width="230" height="292" rx="28" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="4"/>
    <rect x="134" y="134" width="230" height="292" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="5"/>
    <path d="M151 156 Q248 124 342 162" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="9" stroke-linecap="round"/>
    <rect x="158" y="190" width="44" height="34" rx="8" fill="#6D4AA7" fill-opacity=".26" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3"/>
    <path d="M180 191 V223 M158 207 H202" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="2"/>
    <path d="M160 360 H240" stroke="#FFFFFF" stroke-opacity=".68" stroke-width="9" stroke-linecap="round"/>
    <path d="M160 382 H210" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- banknote in front -->
  <g filter="url(#shadow)" transform="rotate(10 310 304)">
    <rect x="236" y="246" width="190" height="118" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-width="5" stroke-opacity=".9"/>
    <rect x="250" y="260" width="162" height="90" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="3"/>
    <circle cx="331" cy="305" r="31" fill="url(#glassDark)" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3"/>
    <path d="M331 282 V328 M343 291 Q331 281 320 291 Q310 302 331 305 Q352 309 342 320 Q331 331 318 320" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M252 274 L266 274 M397 336 L411 336" stroke="#FFFFFF" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- stacked coins -->
  <g filter="url(#shadow)">
    <ellipse cx="394" cy="390" rx="45" ry="17" fill="#8D69D2" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="3"/>
    <path d="M349 366 V390 C349 400 369 407 394 407 S439 400 439 390 V366" fill="url(#coin)" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="4"/>
    <ellipse cx="394" cy="366" rx="45" ry="17" fill="url(#coin)" stroke="#FFFFFF" stroke-width="4"/>
    <ellipse cx="394" cy="366" rx="28" ry="9" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3"/>
    <path d="M367 343 V359 C367 369 383 376 403 376 S439 369 439 359 V343" fill="url(#coin)" stroke="#FFFFFF" stroke-opacity=".84" stroke-width="4"/>
    <ellipse cx="403" cy="343" rx="36" ry="14" fill="url(#coin)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M403 333 V353 M412 337 Q403 330 395 337 Q388 344 403 346 Q418 349 411 355 Q403 361 394 354" fill="none" stroke="#7654B2" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M112 148 Q150 118 193 128" fill="none" stroke="#FFFFFF" stroke-opacity=".36" stroke-width="5" stroke-linecap="round"/>
  <circle cx="410" cy="126" r="7" fill="#FFFFFF" opacity=".7"/><circle cx="90" cy="302" r="5" fill="#FFFFFF" opacity=".55"/>
</svg>