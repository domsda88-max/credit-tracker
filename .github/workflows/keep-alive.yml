name: Keep API awake

# Render Free засыпает после 15 минут без запросов, а тогда не работают
# ни cron-напоминания, ни ежедневная мотивация в 9:30.
# Пингуем health-endpoint каждые 5 минут, чтобы инстанс не засыпал.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://credit-tracker-api.onrender.com/api/health || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "API did not respond with 200"
          exit 1
